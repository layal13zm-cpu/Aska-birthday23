<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>For Aska 💙</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{overflow-x:hidden;background:linear-gradient(145deg,#d9f3ff,#f8fbff 48%,#cfeaff);color:#6687a7}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(#fff 1.5px,transparent 1.5px);background-size:26px 26px}
.page{min-height:100vh;display:grid;place-items:center;padding:24px 14px}
.card{width:min(94vw,520px);position:relative;overflow:hidden;padding:24px 18px 20px;border-radius:34px;background:rgba(255,255,255,.82);border:2px solid rgba(255,255,255,.95);box-shadow:0 25px 70px rgba(86,145,187,.28)}
.decor{position:absolute;pointer-events:none;font-size:24px;animation:float 3s ease-in-out infinite}
.d1{top:60px;left:18px}.d2{top:120px;right:18px;animation-delay:.8s}.d3{bottom:210px;left:18px;animation-delay:1.4s}.d4{bottom:45px;right:24px;animation-delay:.5s}
.top{text-align:center}.tiny{font-size:14px;letter-spacing:3px;color:#91b4d0}h1{margin:2px 0 0;font-size:30px;color:#78a9d1}.name{font-family:cursive;font-size:53px;line-height:1;color:#6198c8;margin:4px 0 8px}
.sub{font-size:14px;color:#8aa7bf;margin-bottom:20px}
.envelope{height:285px;position:relative;cursor:pointer;border-radius:24px;overflow:hidden;background:linear-gradient(155deg,#b9e5ff,#eaf8ff);box-shadow:inset 0 0 0 2px rgba(255,255,255,.8),0 15px 28px rgba(80,145,190,.18);perspective:900px}
.back{position:absolute;inset:0;background:linear-gradient(145deg,#c9ecff,#e8f7ff)}
.paper{position:absolute;z-index:1;left:9%;right:9%;bottom:-72%;height:78%;padding:25px 15px;background:#fffaf7;border-radius:14px 14px 6px 6px;box-shadow:0 5px 18px rgba(70,130,170,.15);transition:bottom .85s cubic-bezier(.2,.8,.2,1)}
.paper span{display:block;text-align:center;font-size:16px;color:#789ab7}
.flap{position:absolute;z-index:4;left:0;top:0;width:100%;height:62%;background:linear-gradient(160deg,#dff4ff,#b9e5ff);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 6px 4px rgba(70,130,170,.13))}
.pocket{position:absolute;z-index:3;inset:auto 0 0;height:62%;background:linear-gradient(20deg,#a9dcfa,#dff5ff);clip-path:polygon(0 100%,0 20%,50% 65%,100% 20%,100% 100%)}
.seal{position:absolute;z-index:6;top:44%;left:50%;width:78px;height:78px;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;background:#a9d9f6;border:5px solid white;font-size:32px;box-shadow:0 7px 18px rgba(70,130,175,.2);transition:.55s}
.prompt{position:absolute;z-index:7;bottom:22px;left:0;right:0;text-align:center;font-weight:700;color:#638fb6;font-size:16px;transition:.35s}
.envelope.open .flap{transform:rotateX(180deg)}.envelope.open .paper{bottom:7%}.envelope.open .seal{opacity:0;transform:translate(-50%,-20%) scale(.4)}.envelope.open .prompt{opacity:0}
.reveal{display:none;margin-top:20px}.opened .reveal{display:block;animation:rise .8s ease both}
.art{display:block;width:100%;border-radius:24px;box-shadow:0 13px 30px rgba(70,130,175,.2);border:5px solid white}
.message{margin-top:18px;padding:22px 16px;background:#fffaf7;border:2px solid #e5f3fb;border-radius:24px;text-align:center;font-size:18px;line-height:2;color:#708ca8;box-shadow:0 8px 22px rgba(90,140,180,.12)}
.message b{color:#6f9ec5}.purple{color:#9675c8}.footer{margin-top:12px;text-align:center;font-size:12px;color:#9ab2c7}
.again{display:block;margin:15px auto 0;border:0;border-radius:999px;padding:10px 18px;background:#d5efff;color:#628db3;font-weight:700;cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-9px) rotate(8deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;z-index:20;pointer-events:none;font-size:22px;animation:fall 1.7s ease-out forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(600deg);opacity:0}}
@media(max-width:430px){.card{padding:20px 14px}h1{font-size:27px}.name{font-size:47px}.envelope{height:250px}.message{font-size:16px}}
</style>
</head>

والعمر كله يارب.<br>
سنه مليئة بالسعاده والفرح وتتحقق أمنياتك <span class="purple">💜</span>
<div style="margin-top:8px"><b>من اختك ليال 💙</b></div>
</div>
<div class="footer">♡ for my favorite Aska ♡</div>
<button class="again" id="again">أعيدي المفاجأة ✨</button>
</section>
</main></div>
<script>
const env=document.getElementById('env'),card=document.getElementById('card'),again=document.getElementById('again');
function confetti(){
 const bits=['💙','🩵','🤍','✨','🌸','🎀'];
 for(let i=0;i<28;i++){const x=document.createElement('div');x.className='confetti';x.textContent=bits[Math.floor(Math.random()*bits.length)];x.style.left=Math.random()*100+'vw';x.style.top=(-10-Math.random()*20)+'vh';x.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(x);setTimeout(()=>x.remove(),2100)}
}
env.onclick=()=>{if(!env.classList.contains('open')){env.classList.add('open');card.classList.add('opened');setTimeout(confetti,550)}};
again.onclick=()=>{env.classList.remove('open');card.classList.remove('opened');window.scrollTo({top:0,behavior:'smooth'})};
</script>
</body></html>
